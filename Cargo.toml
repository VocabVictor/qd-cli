[package]
name = "qudongctl"
version = "0.5.7"
edition = "2024"
description = "Low-memory, high-concurrency CLI for a GPU training platform"
license = "MIT"

[[bin]]
name = "qd"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
axum = { version = "0.8", features = ["ws"] }
base64 = "0.22"
futures-util = "0.3"
native-tls = "0.2"
rand = "0.8.5"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "query", "rustls"] }
rpassword = "7.5"
rsa = "0.9.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.53", features = ["macros", "net", "rt", "sync", "time"] }
tokio-tungstenite = { version = "0.28", features = ["connect", "native-tls"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security_Cryptography", "Win32_System_Console", "Win32_System_ProcessStatus", "Win32_System_Threading"] }

[target.'cfg(not(windows))'.dependencies]
aes-gcm = "0.10"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3.23"
tiny_http = "0.12"

[profile.release]
opt-level = 3
# lto 与 codegen-units 保持默认（thin-local / 16）：实测对 qd 这种
# 纯 I/O 的 CLI，开满优化只让二进制小 11.6%，启动耗时无差别（46ms vs
# 45ms），却让编译时间翻倍（21s -> 45s）。CI 六平台构建更吃这个亏。
lto = false
codegen-units = 16
panic = "abort"
strip = "symbols"
