[package]
name = "qudongctl"
version = "0.5.1"
edition = "2024"
description = "Low-memory, high-concurrency CLI for a GPU training platform"
license = "MIT"

[[bin]]
name = "qd"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
axum = { version = "0.8", features = ["ws"] }
base64 = "0.22"
futures-util = "0.3"
native-tls = "0.2"
rand = "0.8.5"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "query", "rustls"] }
rpassword = "7.5"
rsa = "0.9.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.53", features = ["macros", "net", "rt", "sync", "time"] }
tokio-tungstenite = { version = "0.28", features = ["connect", "native-tls"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security_Cryptography", "Win32_System_Console", "Win32_System_ProcessStatus", "Win32_System_Threading"] }

[target.'cfg(not(windows))'.dependencies]
aes-gcm = "0.10"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3.23"
tiny_http = "0.12"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"
